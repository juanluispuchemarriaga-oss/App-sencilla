name: Crear APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Crear archivos del proyecto
        run: |
          mkdir -p app/src/main/java/com/horavoz/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HoraConVoz"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.horavoz.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.horavoz.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:label="Hora con Voz"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepAliveService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="avisos de la hora" />
                  </service>

                  <receiver android:name=".HourReceiver" android:exported="false">
                      <intent-filter>
                          <action android:name="com.horavoz.app.HORA" />
                      </intent-filter>
                  </receiver>

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/horavoz/app/Scheduler.kt <<'EOF'
          package com.horavoz.app

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import java.util.Calendar

          object Scheduler {
              const val ACTION = "com.horavoz.app.HORA"
              private const val PREFS = "horavoz"
              private const val KEY_ON = "activo"

              private fun pending(ctx: Context): PendingIntent {
                  val i = Intent(ACTION)
                  i.setPackage(ctx.packageName)
                  return PendingIntent.getBroadcast(
                      ctx, 1, i,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
              }

              private fun pendingTest(ctx: Context): PendingIntent {
                  val i = Intent(ACTION)
                  i.setPackage(ctx.packageName)
                  i.putExtra("test", true)
                  return PendingIntent.getBroadcast(
                      ctx, 2, i,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
              }

              fun isOn(ctx: Context): Boolean =
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean(KEY_ON, false)

              fun setOn(ctx: Context, on: Boolean) {
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putBoolean(KEY_ON, on).apply()
              }

              private fun setAt(ctx: Context, t: Long, p: PendingIntent) {
                  val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val show = PendingIntent.getActivity(
                      ctx, 3, Intent(ctx, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  am.setAlarmClock(AlarmManager.AlarmClockInfo(t, show), p)
              }

              fun scheduleNext(ctx: Context) {
                  val c = Calendar.getInstance()
                  c.set(Calendar.MINUTE, 0)
                  c.set(Calendar.SECOND, 0)
                  c.set(Calendar.MILLISECOND, 0)
                  c.add(Calendar.HOUR_OF_DAY, 1)
                  setAt(ctx, c.timeInMillis, pending(ctx))
              }

              fun scheduleTest(ctx: Context) {
                  val t = System.currentTimeMillis() + 60000
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putLong("pruebaEn", t).apply()
                  setAt(ctx, t, pendingTest(ctx))
              }

              fun startService(ctx: Context) {
                  val i = Intent(ctx, KeepAliveService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(i) else ctx.startService(i)
              }

              fun stopService(ctx: Context) {
                  ctx.stopService(Intent(ctx, KeepAliveService::class.java))
              }

              fun cancel(ctx: Context) {
                  val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  am.cancel(pending(ctx))
              }
          }
          EOF

          cat > app/src/main/java/com/horavoz/app/Announcer.kt <<'EOF'
          package com.horavoz.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.atomic.AtomicBoolean

          object Announcer {

              fun phrase(): String {
                  val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val nombres = arrayOf(
                      "doce", "una", "dos", "tres", "cuatro", "cinco",
                      "seis", "siete", "ocho", "nueve", "diez", "once"
                  )
                  val n = nombres[h % 12]
                  val verbo = if (h % 12 == 1) "Es la" else "Son las"
                  val momento = when (h) {
                      0 -> "de la noche"
                      in 1..5 -> "de la madrugada"
                      in 6..11 -> "de la mañana"
                      12 -> "del mediodía"
                      in 13..19 -> "de la tarde"
                      else -> "de la noche"
                  }
                  return "$verbo $n $momento"
              }

              // Lo llaman la alarma (receptor del manifiesto) y el servicio (receptor dinamico).
              // Si llegan los dos, solo se anuncia una vez.
              fun handle(app: Context, intent: Intent, done: () -> Unit) {
                  val test = intent.getBooleanExtra("test", false)
                  val prefs = app.getSharedPreferences("horavoz", Context.MODE_PRIVATE)
                  val ahora = Date()
                  val marca = SimpleDateFormat("d MMM HH:mm:ss", Locale("es")).format(ahora)
                  prefs.edit().putString("ultimo", if (test) marca + " (prueba)" else marca).apply()
                  if (!test) {
                      if (!Scheduler.isOn(app)) {
                          done()
                          return
                      }
                      Scheduler.scheduleNext(app)
                  }
                  val formato = if (test) "yyyyMMddHHmm" else "yyyyMMddHH"
                  val clave = (if (test) "T" else "H") + SimpleDateFormat(formato, Locale.US).format(ahora)
                  if (prefs.getString("clave", "") == clave) {
                      done()
                      return
                  }
                  prefs.edit().putString("clave", clave).apply()
                  run(app, done)
              }

              fun run(ctx: Context, done: () -> Unit) {
                  val text = phrase()
                  notify(ctx, text)
                  speak(ctx, text, done)
              }

              private fun notify(ctx: Context, text: String) {
                  val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel("hora", "Aviso de la hora", NotificationManager.IMPORTANCE_HIGH)
                      )
                  }
                  val open = PendingIntent.getActivity(
                      ctx, 0, Intent(ctx, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(ctx, "hora")
                          else Notification.Builder(ctx)
                  b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                  b.setContentTitle("Hora")
                  b.setContentText(text)
                  b.setContentIntent(open)
                  b.setAutoCancel(true)
                  nm.notify(1, b.build())
              }

              private fun speak(ctx: Context, text: String, done: () -> Unit) {
                  val finished = AtomicBoolean(false)
                  var tts: TextToSpeech? = null
                  val finish = {
                      if (finished.compareAndSet(false, true)) {
                          try { tts?.shutdown() } catch (e: Exception) { }
                          done()
                      }
                  }
                  Handler(Looper.getMainLooper()).postDelayed({ finish() }, 9000)
                  tts = TextToSpeech(ctx) { status ->
                      val t = tts
                      if (status == TextToSpeech.SUCCESS && t != null) {
                          t.language = Locale("es")
                          t.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build()
                          )
                          t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) { finish() }
                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) { finish() }
                          })
                          t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "hora")
                      } else {
                          finish()
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/horavoz/app/HourReceiver.kt <<'EOF'
          package com.horavoz.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class HourReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val app = context.applicationContext
                  val pr = goAsync()
                  Announcer.handle(app, intent) { pr.finish() }
                  try { Scheduler.startService(app) } catch (e: Exception) { }
              }
          }
          EOF

          cat > app/src/main/java/com/horavoz/app/KeepAliveService.kt <<'EOF'
          package com.horavoz.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Locale

          class KeepAliveService : Service() {
              companion object {
                  @Volatile
                  var latido = 0L
              }

              private var rx: BroadcastReceiver? = null
              private var wl: PowerManager.WakeLock? = null
              private val handler = Handler(Looper.getMainLooper())
              private var claveHora = ""

              // Cada 5 segundos mira el reloj del telefono.
              private val ciclo = object : Runnable {
                  override fun run() {
                      try { revisar() } catch (e: Exception) { }
                      handler.postDelayed(this, 5000)
                  }
              }

              private fun revisar() {
                  val ahora = System.currentTimeMillis()
                  latido = ahora
                  val app = applicationContext
                  val prefs = app.getSharedPreferences("horavoz", Context.MODE_PRIVATE)
                  val c = Calendar.getInstance()
                  if (c.get(Calendar.MINUTE) == 0) {
                      val clave = SimpleDateFormat("yyyyMMddHH", Locale.US).format(c.time)
                      if (clave != claveHora) {
                          claveHora = clave
                          Announcer.handle(app, Intent(Scheduler.ACTION)) { }
                      }
                  }
                  val pe = prefs.getLong("pruebaEn", 0L)
                  if (pe > 0L && ahora >= pe) {
                      prefs.edit().putLong("pruebaEn", 0L).apply()
                      val i = Intent(Scheduler.ACTION)
                      i.putExtra("test", true)
                      Announcer.handle(app, i) { }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  val lock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "horavoz:servicio")
                  lock.acquire()
                  wl = lock

                  val r = object : BroadcastReceiver() {
                      override fun onReceive(c: Context, i: Intent) {
                          Announcer.handle(applicationContext, i) { }
                      }
                  }
                  val f = IntentFilter(Scheduler.ACTION)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(r, f, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(r, f)
                  }
                  rx = r

                  handler.post(ciclo)
              }

              override fun onDestroy() {
                  handler.removeCallbacks(ciclo)
                  latido = 0L
                  try { unregisterReceiver(rx) } catch (e: Exception) { }
                  try {
                      val lock = wl
                      if (lock != null && lock.isHeld) lock.release()
                  } catch (e: Exception) { }
                  super.onDestroy()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel("servicio", "Avisos activos", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val open = PendingIntent.getActivity(
                      this, 4, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "servicio")
                          else Notification.Builder(this)
                  b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                  b.setContentTitle("Hora con Voz activo")
                  b.setContentText("Te aviso cada hora en punto")
                  b.setContentIntent(open)
                  b.setOngoing(true)
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(2, b.build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(2, b.build())
                  }
                  return START_STICKY
              }
          }
          EOF

          cat > app/src/main/java/com/horavoz/app/BootReceiver.kt <<'EOF'
          package com.horavoz.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (Scheduler.isOn(context)) {
                      Scheduler.scheduleNext(context)
                      try { Scheduler.startService(context) } catch (e: Exception) { }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/horavoz/app/MainActivity.kt <<'EOF'
          package com.horavoz.app

          import android.Manifest
          import android.app.Activity
          import android.app.AlarmManager
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var estado: TextView
              private lateinit var diag: TextView
              private lateinit var btn: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(48, 120, 48, 48)

                  estado = TextView(this)
                  estado.textSize = 22f
                  estado.setPadding(0, 0, 0, 24)

                  diag = TextView(this)
                  diag.textSize = 14f
                  diag.setPadding(0, 0, 0, 32)

                  btn = Button(this)
                  val prueba = Button(this)
                  prueba.text = "Probar ahora (voz + notificación)"
                  val unMin = Button(this)
                  unMin.text = "Probar en 1 minuto (sal de la app)"
                  val actualizar = Button(this)
                  actualizar.text = "Actualizar diagnóstico"
                  val bateria = Button(this)
                  bateria.text = "Ajustes de batería (recomendado)"
                  val ajustes = Button(this)
                  ajustes.text = "Ajustes de la app (permisos)"

                  btn.setOnClickListener {
                      if (Scheduler.isOn(this)) {
                          Scheduler.setOn(this, false)
                          Scheduler.cancel(this)
                          Scheduler.stopService(this)
                      } else {
                          Scheduler.setOn(this, true)
                          Scheduler.scheduleNext(this)
                          Scheduler.startService(this)
                      }
                      refrescar()
                  }

                  prueba.setOnClickListener {
                      Announcer.run(applicationContext) { }
                  }

                  unMin.setOnClickListener {
                      if (Scheduler.isOn(this)) {
                          Scheduler.scheduleTest(this)
                          Toast.makeText(this, "Sal de la app. En 1 minuto debe sonar.", Toast.LENGTH_LONG).show()
                      } else {
                          Toast.makeText(this, "Primero toca Activar avisos.", Toast.LENGTH_LONG).show()
                      }
                      refrescar()
                  }

                  actualizar.setOnClickListener { refrescar() }

                  bateria.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                  }

                  ajustes.setOnClickListener {
                      val i = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                      i.data = Uri.parse("package:" + packageName)
                      startActivity(i)
                  }

                  layout.addView(estado)
                  layout.addView(diag)
                  layout.addView(btn)
                  layout.addView(prueba)
                  layout.addView(unMin)
                  layout.addView(actualizar)
                  layout.addView(bateria)
                  layout.addView(ajustes)

                  val scroll = ScrollView(this)
                  scroll.addView(layout)
                  setContentView(scroll)
                  if (Scheduler.isOn(this)) {
                      try { Scheduler.startService(this) } catch (e: Exception) { }
                  }
                  refrescar()
              }

              override fun onResume() {
                  super.onResume()
                  refrescar()
              }

              private fun refrescar() {
                  if (Scheduler.isOn(this)) {
                      estado.text = "✅ Avisos ACTIVADOS\nTe aviso cada hora en punto."
                      btn.text = "Desactivar avisos"
                  } else {
                      estado.text = "⏸️ Avisos APAGADOS"
                      btn.text = "Activar avisos"
                  }
                  val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  val fmt = SimpleDateFormat("d MMM HH:mm:ss", Locale("es"))
                  val info = am.nextAlarmClock
                  val prox = if (info != null) fmt.format(Date(info.triggerTime)) else "ninguna"
                  val ultimo = getSharedPreferences("horavoz", Context.MODE_PRIVATE).getString("ultimo", "nunca")
                  val notif = if (nm.areNotificationsEnabled()) "sí" else "NO"
                  val bat = if (pm.isIgnoringBatteryOptimizations(packageName)) "sí" else "NO"
                  val lat = KeepAliveService.latido
                  val srv = if (lat == 0L) "detenido" else "vivo (hace " + ((System.currentTimeMillis() - lat) / 1000) + " s)"
                  diag.text = "DIAGNÓSTICO\n" +
                      "Servicio: " + srv + "\n" +
                      "Android " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")\n" +
                      "Notificaciones permitidas: " + notif + "\n" +
                      "Batería sin restricción: " + bat + "\n" +
                      "Próxima alarma: " + prox + "\n" +
                      "Último aviso recibido: " + ultimo
              }
          }
          EOF

      - name: Agregar icono
        run: |
          IMG=$(find . -maxdepth 1 -type f -size +0 \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | head -n 1)
          if [ -n "$IMG" ]; then
            sudo apt-get install -y imagemagick
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            if convert "$IMG" -gravity North -crop 1:1 +repage -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; then
              sed -i 's|android:label="Hora con Voz"|android:icon="@mipmap/ic_launcher" android:label="Hora con Voz"|' app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HoraConVoz-APK
          path: app/build/outputs/apk/debug/app-debug.apk

# FIN DEL ARCHIVO
